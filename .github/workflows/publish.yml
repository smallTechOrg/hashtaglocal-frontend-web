name: publish-to-github-pages
on:
  push:
    branches:
      - main
      - staging

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == 'main'
    environment: production

    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js ⚙️ - Cache dependencies ⚡ - Install dependencies 🔧
        uses: ./.github/workflows/setup-node

      - name: Setup Pages ⚙️
        uses: actions/configure-pages@v4
        with:
          static_site_generator: next

      - name: Build with Next.js 🏗️
        run: npx next build
        working-directory: ./code

      - name: Upload artifact 📡
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./code/out

  deploy:
    if: github.ref_name == 'main'

    environment:
      name: production
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publish to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4
  
  deploy-staging-vercel:
    if: github.ref_name == 'staging'
    environment: staging
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Setup Node.js ⚙️ - Cache dependencies ⚡ - Install dependencies 🔧
        uses: ./.github/workflows/setup-node
      - name: Install Vercel CLI ⚙️
        run: npm install --global vercel@latest
      - name: Deploy Staging to Vercel 🚀
        id: deploy
        run: |
          echo "url=$(vercel deploy --prod \
            --token=${{ vars.VERCEL_TOKEN }})" >> $GITHUB_OUTPUT
        working-directory: ./code
      - name: Alias to Staging Domain 🔗
        run: vercel alias set ${{ steps.deploy.outputs.url }} ${{ vars.STAGING_DOMAIN }} --token=${{ vars.VERCEL_TOKEN }}
        working-directory: ./code
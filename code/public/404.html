<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // GitHub Pages SPA redirect hack
    // Store the current path and redirect to index.html with the path as a query parameter
    sessionStorage.redirect = location.href;
    location.replace(
      location.origin +
      location.pathname.split('/').slice(0, -1).join('/') +
      '/?redirect=' +
      encodeURIComponent(location.pathname + location.search + location.hash)
    );
  </script>
</head>
<body>
</body>
</html>
